version: '3.8'

services:
  # API Service
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/api:/app
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
      - ml-service
    networks:
      - sentinel-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ML Service
  ml-service:
    build:
      context: ./src/ml
      dockerfile: Dockerfile
    volumes:
      - ./src/ml:/app
      - ./data:/data
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - sentinel-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
    shm_size: '8gb'

  # Blockchain Node
  blockchain-node:
    build:
      context: ./src/blockchain
      dockerfile: Dockerfile
    volumes:
      - ./src/blockchain:/app
      - blockchain-data:/var/hyperledger
    env_file:
      - ./.env
    networks:
      - sentinel-network
    ports:
      - "7050:7050"
      - "7051:7051"

  # Frontend Service
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
    env_file:
      - ./.env
    depends_on:
      - api
    networks:
      - sentinel-network

  # Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentineldb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/config/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching and Message Queue
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-sentinel_secure_redis} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./src/config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - sentinel-network

  # Visualization with Grafana
  grafana:
    image: grafana/grafana:10.0.0
    volumes:
      - grafana-data:/var/lib/grafana
      - ./src/config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_secure_password}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    networks:
      - sentinel-network
    depends_on:
      - prometheus

networks:
  sentinel-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  blockchain-data: 